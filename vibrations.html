    <style>
        /* ── Grid Gallery ── */
        .vib-grid {
            columns: 3;
            column-gap: 8px;
            padding: 20px 40px 60px;
            width: 100%;
            box-sizing: border-box;
        }

        .vib-item {
            break-inside: avoid;
            margin-bottom: 8px;
            overflow: hidden;
            cursor: zoom-in;
            display: block;
        }

        .vib-item img,
        .vib-item video {
            width: 100%;
            height: auto;
            display: block;
            transition: opacity 0.25s ease;
        }

        .vib-item:hover img,
        .vib-item:hover video {
            opacity: 0.85;
        }

        /* ── Play button overlay for videos ── */
        .vib-item[data-type="video"] {
            position: relative;
            cursor: pointer;
        }

        .vib-item[data-type="video"]::after {
            content: '▶';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 121, 0, 0.9);
            font-size: 3rem;
            pointer-events: none;
            z-index: 2;
        }

        /* ── Lightbox ── */
        .vib-lightbox {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            cursor: zoom-out;
            padding: 40px; /* Safe space for close button */
            box-sizing: border-box;
        }

        .vib-lightbox.active {
            display: flex;
        }

        .vib-lightbox img,
        .vib-lightbox video {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block;
        }

        .vib-lightbox-close {
            position: fixed;
            top: 15px;
            right: 15px;
            font-size: 2.2rem;
            color: #ff7900;
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'IBM Plex Mono', monospace;
            z-index: 1210;
            line-height: 1;
            padding: 10px;
        }

        /* ── Mobile: JS masonry takes over ── */
        @media (max-width: 768px) {
            .vib-grid {
                display: block;
                position: relative;
                padding: 20px 4px 40px;
                columns: unset;
            }
            .vib-item {
                position: absolute;
                margin: 0;
            }
            .vib-item img,
            .vib-item video {
                width: 100%;
                height: auto;
                object-fit: unset;
            }
        }

        /* hide old carousel styles from leaking */
        .vibrations-main {
            padding: 0 !important;
        }
    </style>

    <script src="script.js?v=201"></script>
    <script>
        // Grid lightbox state
        const items = [...document.querySelectorAll('.vib-item')];
        const lb = document.getElementById('vib-lightbox');
        const lbImg = document.getElementById('vib-lb-img');
        const lbVid = document.getElementById('vib-lb-video');
        const lbClose = document.getElementById('vib-close');
        let currentIndex = -1;

        function showItem(index) {
            if (index < 0) index = items.length - 1;
            if (index >= items.length) index = 0;
            currentIndex = index;

            const item = items[currentIndex];
            const type = item.dataset.type;
            const src = item.dataset.src;

            if (type === 'video') {
                lbImg.style.display = 'none';
                lbVid.src = src;
                lbVid.style.display = 'block';
                lbVid.play();
            } else {
                lbVid.style.display = 'none';
                lbVid.pause();
                lbVid.src = '';
                lbImg.src = src;
                lbImg.style.display = 'block';
            }
            lb.classList.add('active');
        }

        items.forEach((item, index) => {
            item.addEventListener('click', () => showItem(index));
        });

        function closeLb() {
            lb.classList.remove('active');
            lbVid.pause();
            lbVid.src = '';
            lbImg.src = '';
            currentIndex = -1;
        }

        lbClose.addEventListener('click', closeLb);
        lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

        // Swipe & Navigation
        let touchStartX = 0;
        let touchEndX = 0;

        lb.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        lb.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const diff = touchStartX - touchEndX;
            if (Math.abs(diff) > 50) { // threshold
                if (diff > 0) showItem(currentIndex + 1); // Swipe left -> next
                else showItem(currentIndex - 1); // Swipe right -> prev
            }
        }

        document.addEventListener('keydown', e => {
            if (!lb.classList.contains('active')) return;
            if (e.key === 'Escape') closeLb();
            if (e.key === 'ArrowRight') showItem(currentIndex + 1);
            if (e.key === 'ArrowLeft') showItem(currentIndex - 1);
        });

        // ── JS Masonry for mobile ──
        function masonryLayout() {
            if (window.innerWidth > 768) {
                // Reset inline styles on desktop
                document.querySelectorAll('.vib-item').forEach(el => el.removeAttribute('style'));
                document.querySelector('.vib-grid').style.height = '';
                return;
            }
            const grid = document.querySelector('.vib-grid');
            const els = [...grid.querySelectorAll('.vib-item')];
            const gap = 4;
            const sidePad = 4;
            const topPad = 28; // Increased for same desktop-like gap
            const totalW = grid.clientWidth - sidePad * 2;
            const colW = (totalW - gap) / 2;
            const tops = [topPad, topPad];

            els.forEach(el => {
                const col = tops[0] <= tops[1] ? 0 : 1;
                const x = sidePad + col * (colW + gap);
                const y = tops[col];
                el.style.cssText = `position:absolute;width:${colW}px;left:${x}px;top:${y}px;margin:0;`;
                tops[col] += el.offsetHeight + gap;
            });
            grid.style.height = (Math.max(...tops) + sidePad) + 'px';
        }

        // Wait for all images then run masonry
        const allImgs = document.querySelectorAll('.vib-item img');
        let loaded = 0;
        function tryMasonry() { if (++loaded >= allImgs.length) masonryLayout(); }
        allImgs.forEach(img => {
            if (img.complete) tryMasonry();
            else { img.addEventListener('load', tryMasonry); img.addEventListener('error', tryMasonry); }
        });
        if (!allImgs.length) masonryLayout();
        window.addEventListener('resize', masonryLayout);
    </script>
